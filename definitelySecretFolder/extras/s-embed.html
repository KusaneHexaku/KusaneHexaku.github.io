<!DOCTYPE html>
<html>
<head>
<style>
 body{height:97vh;padding:0;display:grid;align-content:center;justify-content:center;background-color:#c4c4c4}
</style>
</head>
<body>
<div id='fifteen'><img src="../img/s-bg-number.png"></div>

<script>
var p={
	"diff": "300",
    "emptySlot": 16,
	"size": [
		602,
		602
	],
	"grid": [
		3,
		3
	],
	"fill": true,
	"number": false,
	"art": {
		"url":"../img/s-15.png",
        "urlList": [["../img/s-0.png","../img/s-1.png","../img/s-2.png","../img/s-3.png"],["../img/s-4.png","../img/s-5.png","../img/s-6.png","../img/s-7.png"],["../img/s-8.png","../img/s-9.png","../img/s-10.png","../img/s-11.png"],["../img/s-12.png","../img/s-13.png","../img/s-14.png","../img/s-15.png"],],

        "ratio": true
	},
	"keyBoard": true,
	"gamePad": true,
	"time": 0.1,
	"style": "background-color:#ffffff;display:grid;justify-items:center;align-items:center;font-family:Arial;color:#fff;border-radius:0px;font-size:57px;",
    "firstClick": true
},freeslot=[],size=[],m=[],o,f=document.getElementById("fifteen"),bgposxleft=[],bgposytop=[]
, debugMode = false, forceSprite = 14
;

function preloadImage()
{
    for(let q=0;q<=15;q++)
    {
        var img=new Image();
        img.src="../img/s-"+q;
    }
}
preloadImage()
createTiles();
function createTiles(){
    size=[p.size[0]/(p.grid[0]+1),p.size[1]/(p.grid[1]+1)];
    let c=(p.emptySlot)?p.emptySlot:(p.grid[1]+1)*(p.grid[0]+1);
    f.style.width=p.size[0]+'px';
    f.style.height=p.size[1]+'px';
    f.style.position='relative';
    if(p.fill){tileSizeAdjust();window.addEventListener('resize',tileSizeAdjust,true);}
    o=1;
    for(let y=0;y<=p.grid[1];y++){
        for(let x=0;x<=p.grid[0];x++){
            if(o!=c){
                if(!m[y]){m[y]=[]};m[y][x]=o;
                let e=document.createElement("div");
                e.id="slot"+o;
                e.setAttribute("onclick","moveTile("+o+")");
                e.className="slot";
                if(p.number){e.innerHTML=o}
                e.style="background-image:url("+p.art.url+");background-size:"+((p.art.ratio)? p.size[0]+"px auto":"auto "+p.size[1]+"px")+";background-position:-"+(size[0]*x)+"px -"+(size[1]*y)+"px ;width:"+size[0]+"px;height:"+size[1]+"px;top:"+(size[1]*y)+"px;left:"+(size[0]*x)+"px;position:absolute;"+((p.style)?p.style:"")
                bgposxleft.push(size[0]*x);
                bgposytop.push(size[1]*y);
                if(p.time){e.style.transitionDuration=p.time+"s"}
                f.appendChild(e);o++;
            }else{m[y][x]=0;freeslot=[y,x];o++;}
        }
    }
}
function spriteUpdate(){
    if (debugMode) { p.art.url=p.art.urlList[Math.floor(forceSprite / 4)][forceSprite % 4] }
    else { p.art.url=p.art.urlList[freeslot[0]][freeslot[1]] }
    for(let j=1;j<=16;j++){
        if(j!=p.emptySlot){
        let e=document.getElementById("slot"+j)      
        e.style.backgroundImage = "url("+p.art.url+")"
        };
    }
}
function shuffleTiles(){
    for(let y=0;y<p.diff;y++){
        let a=[];
        if((Math.random()*2)>1){
            a=[freeslot[0]+(-1+Math.round(Math.random()*2)),freeslot[1]];
            if(a[0]<0){a[0]=a[0]+2}else if(a[0]>p.grid[1]){a[0]=a[0]-2}
        }else{
            a=[freeslot[0],freeslot[1]+(-1+Math.round(Math.random()*2))];
            if(a[1]<0){a[1]=a[1]+2}else if(a[1]>p.grid[0]){a[1]=a[1]-2}
        }
        let s=[m[freeslot[0]][freeslot[1]],m[a[0]][a[1]]]
        m[freeslot[0]][freeslot[1]]=s[1];m[a[0]][a[1]]=s[0]
        freeslot=[a[0],a[1]];
    }
    for(let y=0;y<=p.grid[1];y++){
        for(let x=0;x<=p.grid[0];x++){
            if(m[y][x]){
                let e=document.getElementById("slot"+m[y][x])
                e.style.left=(x*size[0])+"px";
                e.style.top =(y*size[1])+"px";
            }
        }
    }
}
function moveTile(s){
    if(p.firstClick){
        shuffleTiles();
        p.firstClick = false}
    let z=0,e,a=[],k,j;
    function move(y,x,h,w){
        j=m[y][x];
        e=document.getElementById("slot"+j);
        e.style.left=((x+w)*size[0])+"px";
        e.style.top =((y+h)*size[1])+"px";
        m[y][x]=k;k=j;
    }
    for (let y=0;y<p.grid[1]+1;y++){
        for(let x=0;x<p.grid[0]+1;x++){
            if(m[y][x]==s){
                a=[y,x];k=0;
                if(freeslot[0]==a[0]){
                    if(freeslot[1]>a[1]){for(z=0;z<freeslot[1]-a[1];z++){move(a[0],a[1]+z,0,+1)}}
                    else if(freeslot[1]<a[1]){for(z=0;z<a[1]-freeslot[1];z++){move(a[0],a[1]-z,0,-1)}}
                    m[freeslot[0]][freeslot[1]]=k;freeslot=[a[0],a[1]];s=false;break;
                }else if(freeslot[1]==a[1]){
                    if(freeslot[0]>a[0]){for(z=0;z<freeslot[0]-a[0];z++){ move(a[0]+z,a[1],+1,0)}}
                    else if(freeslot[0]<a[0]){for(z=0;z<a[0]-freeslot[0];z++){move(a[0]-z,a[1],-1,0)}}
                    m[freeslot[0]][freeslot[1]]=k;freeslot=[a[0],a[1]];s=false;break;
                }
            }if(!s){break;}
        }if(!s){break;}
    }
    spriteUpdate();
    checkSolve();
}
function checkSolve(){
    let check=1;
    for(let y=0;y<=p.grid[1];y++){
        for(let x=0;x<=p.grid[0];x++){
            if(m[y][x]==0||check==m[y][x]){check++}else{break;}
        }
    }//if(check==o){setTimeout(()=>{alert('win') },((p.time)?p.time*1000:0));} // <-- alert('win') script that runs at the end of the game
}
function tileSizeAdjust(){
    let rect=f.parentNode.getBoundingClientRect();
    if((p.size[0]/p.size[1])<(rect.width/rect.height)){f.style.transform='scale('+(rect.height/p.size[1])+')'}
    else{f.style.transform='scale('+(rect.width/p.size[0])+')'}
}
if(p.keyBoard){document.addEventListener("keydown",function(e){
    e=e.keyCode;
         if(e==37){moveTile(m[freeslot[0]][freeslot[1]+1]);}
    else if(e==39){moveTile(m[freeslot[0]][freeslot[1]-1]);}
    else if(e==38){moveTile(m[freeslot[0]+1][freeslot[1]]);}
    else if(e==40){moveTile(m[freeslot[0]-1][freeslot[1]]);}
})}
let gamepad,gamepadPress;
if(p.gamePad){window.addEventListener('gamepadconnected',function(e){
        const update=()=>{
            for (gamepad of navigator.getGamepads()){
                if (!gamepad) continue;
                const statenow=gamepad.buttons.some(btn=>btn.pressed);
                if (gamepadPress!==statenow){
                    gamepadPress=statenow;
                         if(gamepad.buttons[12].pressed&&m[freeslot[0]+1]){moveTile(m[freeslot[0]+1][freeslot[1]]);}
                    else if(gamepad.buttons[14].pressed&&m[freeslot[0]])  {moveTile(m[freeslot[0]][freeslot[1]+1]);}
                    else if(gamepad.buttons[15].pressed&&m[freeslot[0]])  {moveTile(m[freeslot[0]][freeslot[1]-1]);}
                    else if(gamepad.buttons[13].pressed&&m[freeslot[0]-1]){moveTile(m[freeslot[0]-1][freeslot[1]]);}
                }
            }
            requestAnimationFrame(update);
        };update();
    });
}


</script>
</body>
</html>
